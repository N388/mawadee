<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16162a">
<title>مواضيعي معهم</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: linear-gradient(180deg, #16162a 0%, #1c1c2e 40%, #181828 100%);
    background-attachment: fixed;
    color:#f0f0f5; min-height:100vh;
  }
  .container { max-width:560px; margin:0 auto; padding:20px 16px 60px; }

  header { position:sticky; top:0; z-index:10; padding:14px 0 12px; margin:0 -16px 18px; padding-left:16px; padding-right:16px;
    background:rgba(22,22,42,.85); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid #2c2c4a; }
  h1 { font-size:23px; text-align:center; }
  .subtitle { text-align:center; color:#9a9ab0; font-size:13px; margin-top:5px; }
  .stats { text-align:center; color:#8b8bd0; font-size:12px; margin-top:8px; min-height:15px; }

  .add-bar { display:flex; gap:8px; margin-bottom:18px; }
  input[type="text"] {
    flex:1; background:#2a2a44; border:1px solid #3a3a5c; border-radius:12px;
    padding:12px 14px; color:#f0f0f5; font-size:16px; outline:none; transition:border-color .15s;
  }
  input[type="text"]::placeholder { color:#7a7a95; }
  input[type="text"]:focus { border-color:#6c63ff; }
  button { cursor:pointer; font-size:16px; font-family:inherit; }
  .btn-primary {
    background:#6c63ff; color:#fff; border:none; border-radius:12px; padding:0 20px; font-weight:600;
    transition:background .15s, transform .1s;
  }
  .btn-primary:active { background:#5a52d5; transform:scale(.97); }

  .people-grid { display:flex; flex-direction:column; gap:12px; }
  .person-card {
    background:#262640; border:1px solid #35355a; border-radius:16px; overflow:hidden;
    transition:border-color .2s;
  }
  .person-card.open { border-color:#4a4a78; }
  .person-head {
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:15px 16px; cursor:pointer; user-select:none; transition:background .15s;
  }
  .person-head:active { background:#2f2f50; }
  .person-name { font-size:17px; font-weight:600; flex:1; }
  .badge {
    background:#6c63ff; color:#fff; border-radius:20px; font-size:13px;
    padding:3px 11px; min-width:28px; text-align:center;
  }
  .badge.zero { background:#3a3a5c; color:#9a9ab0; }
  .chevron { color:#8b8bd0; font-size:13px; transition:transform .2s; }
  .person-card.open .chevron { transform:rotate(180deg); }

  .person-body { display:none; border-top:1px solid #32325a; padding:12px 14px 14px; }
  .person-card.open .person-body { display:block; }

  .topic-item {
    background:#1f1f36; border:1px solid #303050; border-radius:11px; padding:11px 12px;
    margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .topic-text { font-size:15px; flex:1; line-height:1.6; word-break:break-word; }
  .topic-item.done .topic-text { color:#7a7a95; text-decoration:line-through; }
  .topic-actions { display:flex; gap:6px; flex-shrink:0; }
  .icon-btn {
    background:#2f2f50; border:none; border-radius:8px; color:#c9c9e0;
    padding:6px 10px; font-size:15px; transition:background .15s;
  }
  .icon-btn:active { background:#3d3d66; }

  .topic-add { display:flex; gap:8px; margin-top:4px; }
  .topic-add input { padding:10px 12px; font-size:15px; }
  .topic-add .btn-primary { padding:0 16px; font-size:15px; }

  .del-person {
    background:none; border:none; color:#e05a5a; font-size:13px;
    display:block; margin:12px auto 0; padding:6px 10px;
  }

  .empty { text-align:center; color:#7a7a95; margin-top:50px; font-size:15px; line-height:1.9; }
  .no-topics { text-align:center; color:#7a7a95; font-size:13px; padding:8px 0 4px; }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>مواضيعي معهم</h1>
    <p class="subtitle">اكتب الشخص ثم أضف المواضيع التي تريد مناقشتها معه</p>
    <p class="stats" id="stats"></p>
  </header>

  <div class="add-bar">
    <input type="text" id="newPerson" placeholder="اسم الشخص..." onkeydown="if(event.key==='Enter')addPerson()">
    <button class="btn-primary" onclick="addPerson()">إضافة</button>
  </div>

  <div class="people-grid" id="peopleList"></div>
  <p class="empty" id="emptyMsg">لا يوجد أشخاص بعد.<br>أضف شخصاً لتبدأ بتجميع المواضيع.</p>

</div>

<script>
let data = JSON.parse(localStorage.getItem("topicsApp") || "{}");
const openCards = new Set();

function save() { localStorage.setItem("topicsApp", JSON.stringify(data)); }

function addPerson() {
  const inp = document.getElementById("newPerson");
  const name = inp.value.trim();
  if (!name) return;
  if (!data[name]) data[name] = [];
  inp.value = "";
  openCards.add(name);
  save();
  renderPeople();
}

function toggleCard(name) {
  if (openCards.has(name)) openCards.delete(name);
  else openCards.add(name);
  renderPeople();
}

function addTopic(name) {
  const inp = document.getElementById("topicInput-" + cssId(name));
  const text = inp.value.trim();
  if (!text) return;
  data[name].push({ text, done: false });
  save();
  renderPeople();
}

function toggleTopic(name, i) {
  data[name][i].done = !data[name][i].done;
  save();
  renderPeople();
}

function deleteTopic(name, i) {
  if (confirm("حذف هذا الموضوع نهائياً؟")) {
    data[name].splice(i, 1);
    save();
    renderPeople();
  }
}

function deletePerson(name) {
  if (confirm("حذف " + name + " وكل مواضيعه؟")) {
    delete data[name];
    openCards.delete(name);
    save();
    renderPeople();
  }
}

function cssId(name) {
  return btoa(unescape(encodeURIComponent(name))).replace(/[^a-zA-Z0-9]/g, "");
}

function renderPeople() {
  const list = document.getElementById("peopleList");
  list.innerHTML = "";
  const names = Object.keys(data).sort();
  document.getElementById("emptyMsg").style.display = names.length ? "none" : "block";

  let totalPending = 0;
  names.forEach(name => {
    const topics = data[name];
    const pending = topics.filter(t => !t.done).length;
    totalPending += pending;

    const card = document.createElement("div");
    card.className = "person-card" + (openCards.has(name) ? " open" : "");

    const head = document.createElement("div");
    head.className = "person-head";
    head.onclick = () => toggleCard(name);
    const nameSpan = document.createElement("span");
    nameSpan.className = "person-name";
    nameSpan.textContent = name;
    const badge = document.createElement("span");
    badge.className = "badge" + (pending === 0 ? " zero" : "");
    badge.textContent = pending;
    const chevron = document.createElement("span");
    chevron.className = "chevron";
    chevron.textContent = "▼";
    head.appendChild(nameSpan); head.appendChild(badge); head.appendChild(chevron);
    card.appendChild(head);

    const body = document.createElement("div");
    body.className = "person-body";

    if (!topics.length) {
      const none = document.createElement("p");
      none.className = "no-topics";
      none.textContent = "لا توجد مواضيع مع هذا الشخص بعد.";
      body.appendChild(none);
    }

    const order = topics.map((t, i) => ({ t, i }))
      .sort((a, b) => (a.t.done ? 1 : 0) - (b.t.done ? 1 : 0));
    order.forEach(({ t, i }) => {
      const div = document.createElement("div");
      div.className = "topic-item" + (t.done ? " done" : "");
      const span = document.createElement("span");
      span.className = "topic-text";
      span.textContent = t.text;
      const actions = document.createElement("div");
      actions.className = "topic-actions";
      const doneBtn = document.createElement("button");
      doneBtn.className = "icon-btn";
      doneBtn.textContent = t.done ? "↩️" : "✔️";
      doneBtn.onclick = () => toggleTopic(name, i);
      const delBtn = document.createElement("button");
      delBtn.className = "icon-btn";
      delBtn.textContent = "🗑";
      delBtn.onclick = () => deleteTopic(name, i);
      actions.appendChild(doneBtn); actions.appendChild(delBtn);
      div.appendChild(span); div.appendChild(actions);
      body.appendChild(div);
    });

    const addRow = document.createElement("div");
    addRow.className = "topic-add";
    const topicInput = document.createElement("input");
    topicInput.type = "text";
    topicInput.id = "topicInput-" + cssId(name);
    topicInput.placeholder = "موضوع جديد مع " + name + "...";
    topicInput.onkeydown = (e) => { if (e.key === "Enter") addTopic(name); };
    const addBtn = document.createElement("button");
    addBtn.className = "btn-primary";
    addBtn.textContent = "إضافة";
    addBtn.onclick = () => addTopic(name);
    addRow.appendChild(topicInput); addRow.appendChild(addBtn);
    body.appendChild(addRow);

    const delPerson = document.createElement("button");
    delPerson.className = "del-person";
    delPerson.textContent = "حذف " + name + " وكل مواضيعه";
    delPerson.onclick = () => deletePerson(name);
    body.appendChild(delPerson);

    card.appendChild(body);
    list.appendChild(card);
  });

  document.getElementById("stats").textContent =
    names.length ? ("لديك " + totalPending + " موضوع معلّق مع " + names.length + (names.length === 1 ? " شخص" : " أشخاص")) : "";
}

renderPeople();
</script>
</body>
</html>
